[project]
name = "mortality-table-builder"
version = "1.0.0"
description = "End-to-end actuarial mortality tables for Mexico: official data, graduation, projection, pricing and risk."
readme = "README.md"
license = "MIT"
authors = [{ name = "Miguel Vilchis", email = "migue.vilchis@ciencias.unam.mx" }]
requires-python = ">=3.12"
dependencies = [
    "dbfread>=2.0.7",
    "defusedxml>=0.7.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "pyarrow>=26.0.0",
    "pypdf>=6.21.1",
    "python-calamine>=0.9.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
]

[project.scripts]
mortality = "mortality.cli:main"

[project.optional-dependencies]
app = [
    "streamlit>=1.66.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mortality"]

# ── Linting & formatting ──
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # import sorting
  "B",        # bugbear (likely bugs)
  "UP",       # modern Python syntax
  "NPY",      # NumPy-specific rules
  "PD",       # pandas-specific rules
  "SIM",      # simplifications
  "RUF",      # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
"app/**" = ["E501"]  # dashboard prose and chart specs read better on long lines
"src/mortality/export.py" = ["E501"]  # prose written into the workbook
"src/mortality/figures_insured.py" = ["E501"]  # figure titles and source lines are text

# ── Tests ──
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "network: needs internet access (skipped in CI unless enabled)",
  "slow: long-running test",
]

[dependency-groups]
dev = [
    "formulas>=1.3.4",
    "ipykernel>=7.4.0",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pyyaml>=6.0.3",
    "ruff>=0.17.1",
]
