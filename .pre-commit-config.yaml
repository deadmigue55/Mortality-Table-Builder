# Runs automatically before each commit once installed: uv run pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: ^mkdocs\.yml$
      - id: check-yaml  # MkDocs configuration uses Python tags, which the safe loader refuses
        name: check yaml (mkdocs.yml, syntax only)
        files: ^mkdocs\.yml$
        args: ["--unsafe"]
      - id: check-toml
      - id: check-merge-conflict
      - id: detect-private-key
      # Stops raw data files from being committed by accident
      - id: check-added-large-files
        args: ["--maxkb=5000"]  # the demo bundle in app/data is a few MB

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format
