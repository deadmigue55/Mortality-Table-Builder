site_name: Mortality Table Builder
site_description: From 4.7 million Mexican death records to the table a life insurance quote is priced on. Results, method and the mathematics, derived and tested.
site_url: https://deadmigue55.github.io/Mortality-Table-Builder/
repo_url: https://github.com/deadmigue55/Mortality-Table-Builder
repo_name: deadmigue55/Mortality-Table-Builder
edit_uri: edit/main/docs/
copyright: Miguel Vilchis. MIT license. Every number on these pages is checked against the shipped database.

docs_dir: docs
site_dir: site
strict: true

# The home page is the repository README, taken as it is (see scripts/docs_hooks.py), so the
# front page of the repository and of the site can never disagree.
hooks:
  - scripts/docs_hooks.py

theme:
  name: material
  language: en
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  - Home: index.md
  - Results:
      - Results by step: results.md
      - Insured lives: insured-lives.md
      - Data quality: data-quality.md
      - Crude rates: crude-rates.md
      - Graduation: graduation.md
      - Life tables: life-tables.md
      - Projection: projection.md
      - Experience study: experience-study.md
      - Excess mortality: excess-mortality.md
      - Pricing: pricing.md
      - Stress tests: stress-tests.md
      - Reinsurance: reinsurance.md
  - The mathematics:
      - The handbook: handbook/README.md
      - Notation: handbook/01-notation.md
      - Glossary: handbook/00-glossary.md
      - "2. Data, exposure and quality": handbook/02-data-exposure-quality.md
      - "3. Crude rates and comparison": handbook/03-crude-rates.md
      - "4. Graduation": handbook/04-graduation.md
      - "5. Life tables": handbook/05-life-tables.md
      - "6. Projection": handbook/06-projection.md
      - "7. The experience study": handbook/07-experience-study.md
      - "8. Pricing, profit and reserves": handbook/08-pricing.md
      - "9. Excess mortality and stress tests": handbook/09-excess-stress.md
      - "10. Reinsurance": handbook/10-reinsurance.md
      - "11. The insured-lives table": handbook/11-insured-lives.md
  - Reference:
      - Data sources: data-sources.md
      - The warehouse: warehouse.md
      - Putting the dashboard online: deploy.md
      - Design research: design-research.md
