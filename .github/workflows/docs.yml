name: Docs

# The documentation site: the README as the front page, the results pages and the handbook with
# its mathematics typeset. Every push and pull request builds it (strictly: a dead link or a
# broken image fails the check); a push to main also publishes it to GitHub Pages.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "README.md"
      - "mkdocs.yml"
      - "scripts/docs_hooks.py"
      - "scripts/check_site.py"
      - "uv.lock"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "README.md"
      - "mkdocs.yml"
      - "scripts/docs_hooks.py"
      - "scripts/check_site.py"
      - "uv.lock"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install the documentation tools
        run: uv sync --locked --only-group docs

      - name: Build (strict)
        run: uv run --no-sync mkdocs build --strict

      - name: Check every link, image and anchor in the built site
        run: uv run --no-sync python scripts/check_site.py

      - name: Package the site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Publish to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
